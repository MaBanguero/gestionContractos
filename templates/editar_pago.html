{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 800px;">
    <div class="card shadow border-0">
        <div class="card-header bg-warning text-dark fw-bold">
            <i class="bi bi-pencil-square"></i> Corregir Pago N° {{ pago.numero_pago }} - {{ pago.contrato_id }}
        </div>
        <div class="card-body">
            <form action="/pago/actualizar/{{ pago.id }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Valor a Pagar (Factura)</label>
                        <input type="number" name="valor_a_pagar" value="{{ pago.valor_a_pagar|int }}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Valor Pagado (Giro Real)</label>
                        <input type="number" name="valor_pagado" value="{{ pago.valor_pagado|int }}" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label small fw-bold">Observaciones de Supervisión</label>
                        <textarea name="observaciones" class="form-control" rows="4">{{ pago.observaciones }}</textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-between">
                    <a href="/contrato/{{ pago.contrato_id }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
